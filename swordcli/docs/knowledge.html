<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sword Debate - Knowledge Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        @keyframes neonPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes glitch { 0%, 100% { text-shadow: 2px 0 #ff2d6b, -2px 0 #00ffff; } 25% { text-shadow: -2px 0 #ff2d6b, 2px 0 #00ffff; } 50% { text-shadow: 2px 2px #ff2d6b, -2px -2px #00ffff; } 75% { text-shadow: -2px 2px #ff2d6b, 2px -2px #00ffff; } }

        :root {
            --bg-base: #0a0a0f;
            --bg-surface: #0d0d15;
            --primary: #00ffff;
            --primary-dim: rgba(0, 255, 255, 0.12);
            --secondary: #ff2d6b;
            --accent: #bf00ff;
            --neon-green: #39ff14;
            --text-main: #e0e0ff;
            --text-muted: #7a7a9e;
            --border-light: rgba(0, 255, 255, 0.15);
            --primary-glow: 0 0 10px #00ffff, 0 0 20px rgba(0,255,255,0.3);
            --font-display: 'Orbitron', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
            --font-body: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image:
                linear-gradient(rgba(0,255,255,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,255,.03) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, rgba(0, 255, 255, 0.06), transparent 50%);
            background-size: 50px 50px, 50px 50px, 100% 100%;
            position: relative;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
            pointer-events: none;
            z-index: 9999;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px;
            background: rgba(13, 13, 21, 0.85);
            border: 1px solid var(--border-light);
            border-radius: 0;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0,255,255,0.05), 0 20px 50px rgba(0,0,0,0.5);
        }

        .header { text-align: center; margin-bottom: 30px; }

        h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glitch 3s infinite;
        }

        .upload-area {
            border: 2px dashed var(--border-light);
            padding: 40px;
            border-radius: 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            background: rgba(0,255,255,0.02);
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: var(--primary-dim);
            box-shadow: 0 0 20px rgba(0,255,255,0.1);
        }

        .upload-area i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(0,255,255,0.4);
        }

        .type-selector { display: flex; gap: 10px; margin-bottom: 20px; }

        .type-selector label {
            flex: 1;
            padding: 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: 0;
            text-align: center;
            cursor: pointer;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .type-selector input[type="radio"] { display: none; }
        
        .type-selector input[type="radio"]:checked + label {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            border-radius: 0;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn:hover::after { opacity: 1; }

        .btn:hover {
            border-color: var(--primary);
            background: var(--primary-dim);
            box-shadow: 0 0 10px rgba(0,255,255,0.15);
        }

        #fileInput { display: none; }
        
        .status {
            margin-top: 20px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--neon-green);
            min-height: 20px;
            letter-spacing: .5px;
        }
    </style>
</head>
<body>
<nav style="position:fixed;top:0;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:300;background:rgba(10,10,15,.95);border-bottom:1px solid rgba(0,255,255,.2);padding:0 16px;backdrop-filter:blur(12px);box-shadow:0 0 20px rgba(0,255,255,.1);font-family:var(--font-display);">
    <a href="/debate" style="color:#7a7a9e;text-decoration:none;font-size:.7rem;font-weight:700;padding:12px 16px;letter-spacing:2px;text-transform:uppercase;border-bottom:2px solid transparent;transition:.2s;" onmouseover="this.style.color='#ff2d6b';this.style.borderBottomColor='#ff2d6b'" onmouseout="this.style.color='#7a7a9e';this.style.borderBottomColor='transparent'">Debate</a>
    <a href="/knowledge" style="color:#00ffff;text-decoration:none;font-size:.7rem;font-weight:700;padding:12px 16px;letter-spacing:2px;text-transform:uppercase;border-bottom:2px solid #00ffff;text-shadow:0 0 8px rgba(0,255,255,.5);">Knowledge</a>
    <a href="/personal" style="color:#7a7a9e;text-decoration:none;font-size:.7rem;font-weight:700;padding:12px 16px;letter-spacing:2px;text-transform:uppercase;border-bottom:2px solid transparent;transition:.2s;" onmouseover="this.style.color='#ff2d6b';this.style.borderBottomColor='#ff2d6b'" onmouseout="this.style.color='#7a7a9e';this.style.borderBottomColor='transparent'">Personal</a>
    <a href="/business" style="color:#7a7a9e;text-decoration:none;font-size:.7rem;font-weight:700;padding:12px 16px;letter-spacing:2px;text-transform:uppercase;border-bottom:2px solid transparent;transition:.2s;" onmouseover="this.style.color='#ff2d6b';this.style.borderBottomColor='#ff2d6b'" onmouseout="this.style.color='#7a7a9e';this.style.borderBottomColor='transparent'">Business</a>
</nav>

    <div class="container">
        <div class="header">
            <h1>RAG::KNOWLEDGE</h1>
            <p style="color: var(--text-muted); margin-top: 8px; font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 1px;">INJECT DATA INTO THE NEURAL NETWORK</p>
        </div>
        
        <div class="type-selector">
            <input type="radio" id="typeDoc" name="docType" value="doc" checked>
            <label for="typeDoc"><i class="ri-file-text-line"></i> DOCUMENT (.pdf, .txt)</label>
            
            <input type="radio" id="typeCode" name="docType" value="code">
            <label for="typeCode"><i class="ri-code-box-line"></i> CODE (.py, .cpp)</label>
        </div>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <i class="ri-cloud-upload-line"></i>
            <h3 id="fileName" style="font-family:var(--font-display);font-size:.85rem;letter-spacing:2px;text-transform:uppercase;">SELECT DATA FILE</h3>
            <p style="color: var(--text-muted); font-family:var(--font-mono); font-size: 0.7rem; margin-top: 5px; letter-spacing:1px;">OR DRAG AND DROP INTO CONTAINER</p>
        </div>
        
        <input type="file" id="fileInput" onchange="handleFileSelect()">
        
        <div class="status" id="statusMessage"></div>
        
        <div class="indexed-files-container" style="margin-top: 20px; background: rgba(0,255,255,0.03); padding: 15px; border-radius: 0; border: 1px solid rgba(0,255,255,0.1);">
            <h4 style="margin-bottom: 10px; font-family:var(--font-display); font-size: 0.7rem; letter-spacing:2px; text-transform:uppercase; color: var(--primary);">INDEXED MEMORY</h4>
            <div id="ragReport" style="font-family:var(--font-mono); font-size: 0.75rem; max-height: 100px; overflow-y: auto; color: var(--neon-green);">
                LOADING DATA...
            </div>
        </div>

        <button class="btn" style="background: linear-gradient(135deg, var(--primary), var(--accent)); color: #000; border: none; margin-top: 20px; box-shadow: 0 0 20px rgba(0,255,255,0.3);" onclick="uploadFile()">
            <i class="ri-upload-2-fill"></i> UPLOAD & INDEX
        </button>
        
        <a href="/" class="btn"><i class="ri-arrow-left-line"></i> RETURN TO MAIN</a>
    </div>

    <script>
        let selectedFile = null;

        function handleFileSelect() {
            const input = document.getElementById('fileInput');
            if (input.files.length > 0) {
                selectedFile = input.files[0];
                document.getElementById('fileName').innerText = selectedFile.name;
                document.getElementById('statusMessage').innerText = "";
            }
        }

        async function uploadFile() {
            if (!selectedFile) {
                document.getElementById('statusMessage').innerText = "NO FILE SELECTED";
                return;
            }

            const type = document.querySelector('input[name="docType"]:checked').value;
            const formData = new FormData();
            formData.append("file", selectedFile);
            formData.append("type", type);

            document.getElementById('statusMessage').innerHTML = `<i class="ri-loader-4-line" style="animation: spin 1s linear infinite;"></i> INDEXING DATA...`;

            try {
                const response = await fetch('/debate/api/upload_knowledge', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('statusMessage').innerHTML = `INDEXED: <b>${selectedFile.name}</b>`;
                    selectedFile = null;
                    document.getElementById('fileName').innerText = "SELECT DATA FILE";
                    fetchRagReport();
                } else {
                    document.getElementById('statusMessage').innerHTML = `ERROR: ${result.detail || 'UPLOAD FAILED'}`;
                }
            } catch (error) {
                document.getElementById('statusMessage').innerHTML = `NETWORK ERROR: CONNECTION FAILED`;
            }
        }
        
        async function fetchRagReport() {
            try {
                const res = await fetch('/debate/api/rag_report');
                const data = await res.json();
                const reportDiv = document.getElementById('ragReport');
                if (data.indexed && data.indexed.length > 0) {
                    reportDiv.innerHTML = data.indexed.map(f => `<div style="padding: 4px 0;"><i class="ri-check-line"></i> ${f}</div>`).join('');
                } else {
                    reportDiv.innerHTML = `<span style="color: var(--text-muted); font-family:var(--font-mono); font-size:.7rem;">NO DATA INDEXED</span>`;
                }
            } catch (e) {
                document.getElementById('ragReport').innerHTML = "REPORT LOAD FAILED";
            }
        }
        
        // Init
        fetchRagReport();
    </script>
    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
</body>
</html>
